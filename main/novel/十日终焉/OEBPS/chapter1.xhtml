            <title>（不后宫，不套路，不无敌，不系统</title>
            <link rel="stylesheet" type="text/css" href="../style.css"/>
          </head>
          <body><h3></h3><p>（不后宫，不套路，不无敌，不系统，不无脑，不爽文，介意者慎入。）</p><p>当我以为这只是寻常的一天时，却发现自己被捉到了终焉之地。</p><p>当我以为只需要不断的参加死亡游戏就可以逃脱时，却发现众人开始觉醒超自然之力。</p><p>当我以为这里是「造神之地」时，一切却又奔着湮灭走去。</p></body>
        </html>
