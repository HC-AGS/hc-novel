            <title>第三回合，齐夏出了「石头」，而对方依然是「布」。</title>
            <link rel="stylesheet" type="text/css" href="../style.css"/>
          </head>
          <body><h2>第三回合，齐夏出了「石头」，而对方依然是「布」。</h2><p>“你果然花了心思，自始至终都不肯出剪刀……”齐夏喃喃自语道。</p><p>“承让了。”人猴说道，“我猜拳向来很强。”</p><p>“是么？”齐夏瞳孔微动，意味深长。</p></body>
        </html>
